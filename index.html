<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var savedScheme = localStorage.getItem('selah-color-scheme');
        if (savedScheme === 'light' || savedScheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', savedScheme);
        }
      } catch (e) {}
    </script>
    <title>Selah | Bible Reading Ledger</title>
    <meta
      name="description"
      content="Log daily Scripture readings, track progress across all 66 books and 1,189 chapters, and collect reading seals."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
