name: iOS Build & Release

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload signed .ipa to TestFlight (requires signing & App Store Connect secrets)'
        required: false
        type: boolean
        default: false
      build_number:
        description: 'Optional iOS build number (defaults to GitHub run number)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  ios:
    name: Build iOS (Capacitor + Xcode)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Detect optional native secrets
        id: config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "has_google_plist=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_google_plist=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$IOS_CERTIFICATE_BASE64" ] && [ -n "$IOS_CERTIFICATE_PASSWORD" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ] && [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "has_asc_api=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_asc_api=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Configure Firebase GoogleService-Info.plist (if secret provided)
        if: steps.config.outputs.has_google_plist == 'true'
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          PLIST_PATH="ios/App/App/GoogleService-Info.plist"
          INFO_PLIST="ios/App/App/Info.plist"
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > "$PLIST_PATH"

          # Register GoogleService-Info.plist in Xcode Resources if not already present
          node -e '
            const fs = require("fs");
            const pbxPath = process.argv[1];
            let pbx = fs.readFileSync(pbxPath, "utf8");
            if (!pbx.includes("GoogleService-Info.plist")) {
              pbx = pbx.replace(
                "/* Begin PBXBuildFile section */\n",
                "/* Begin PBXBuildFile section */\n\t\t95F1E2D3C4B5A60708090C01 /* GoogleService-Info.plist in Resources */ = {isa = PBXBuildFile; fileRef = 95F1E2D3C4B5A60708090C02 /* GoogleService-Info.plist */; };\n"
              );
              pbx = pbx.replace(
                "/* Begin PBXFileReference section */\n",
                "/* Begin PBXFileReference section */\n\t\t95F1E2D3C4B5A60708090C02 /* GoogleService-Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = GoogleService-Info.plist; sourceTree = \"<group>\"; };\n"
              );
              pbx = pbx.replace(
                "\t\t\t\t2FAD9762203C412B000D30F8 /* config.xml */,\n",
                "\t\t\t\t95F1E2D3C4B5A60708090C02 /* GoogleService-Info.plist */,\n\t\t\t\t2FAD9762203C412B000D30F8 /* config.xml */,\n"
              );
              pbx = pbx.replace(
                "\t\t\t\t2FAD9763203C412B000D30F8 /* config.xml in Resources */,\n",
                "\t\t\t\t95F1E2D3C4B5A60708090C01 /* GoogleService-Info.plist in Resources */,\n\t\t\t\t2FAD9763203C412B000D30F8 /* config.xml in Resources */,\n"
              );
              fs.writeFileSync(pbxPath, pbx, "utf8");
            }
          ' "$PBXPROJ"

          # Register REVERSED_CLIENT_ID URL scheme for Google Sign-In fallback redirects
          REVERSED_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$PLIST_PATH" 2>/dev/null || true)
          if [ -n "$REVERSED_ID" ] && ! grep -q "$REVERSED_ID" "$INFO_PLIST"; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$INFO_PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" "$INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED_ID" "$INFO_PLIST"
          fi

      - name: Set iOS version and build number
        env:
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          MARKETING_VERSION=$(node -e "console.log(require('./package.json').version)")
          BUILD_NUMBER="${INPUT_BUILD_NUMBER:-${GITHUB_RUN_NUMBER}}"
          INFO_PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$INFO_PLIST" || true

          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = $MARKETING_VERSION;/g" "$PBXPROJ"
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBXPROJ"

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Unsigned iOS Simulator verification build (no signing secrets configured)
        if: steps.config.outputs.has_signing != 'true'
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Install Apple Distribution certificate & provisioning profile
        if: steps.config.outputs.has_signing == 'true'
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/app_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/selah-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive & export signed .ipa
        if: steps.config.outputs.has_signing == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/Selah.xcarchive"
          EXPORT_DIR="$RUNNER_TEMP/export"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          node -e '
            const fs = require("fs");
            const plist = [
              "<?xml version=\"1.0\" encoding=\"UTF-8\"?>",
              "<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">",
              "<plist version=\"1.0\">",
              "<dict>",
              "  <key>method</key>",
              "  <string>app-store-connect</string>",
              "  <key>signingStyle</key>",
              "  <string>manual</string>",
              "  <key>teamID</key>",
              `  <string>${process.env.APPLE_TEAM_ID}</string>`,
              "  <key>provisioningProfiles</key>",
              "  <dict>",
              "    <key>com.selah.bible</key>",
              `    <string>${process.env.PROFILE_NAME}</string>`,
              "  </dict>",
              "</dict>",
              "</plist>",
              "",
            ].join("\n");
            fs.writeFileSync(process.argv[1], plist, "utf8");
          ' "$EXPORT_OPTIONS"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$EXPORT_DIR"

          mkdir -p build-artifacts
          cp "$EXPORT_DIR"/*.ipa build-artifacts/

      - name: Upload .ipa artifact
        if: steps.config.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: selah-ios-ipa
          path: build-artifacts/*.ipa
          retention-days: 14

      - name: Upload to TestFlight (optional)
        if: steps.config.outputs.has_signing == 'true' && steps.config.outputs.has_asc_api == 'true' && (github.event.inputs.upload_to_testflight == true || startsWith(github.ref, 'refs/tags/v'))
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_FILE"
          IPA_FILE=$(ls build-artifacts/*.ipa | head -n 1)
          xcrun altool --upload-app \
            -f "$IPA_FILE" \
            --type ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Cleanup temporary keychain & signing keys
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/dist_certificate.p12" "$RUNNER_TEMP/app_profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -rf "$HOME/.appstoreconnect/private_keys"
