name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release requires keystore secrets; falls back to debug if unset)'
        required: false
        type: choice
        options:
          - release
          - debug
        default: release
      version_code:
        description: 'Optional Android versionCode override (defaults to GitHub run number)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  android:
    name: Build Android APK (Capacitor + Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Detect optional Firebase & signing secrets
        id: config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "has_google_services=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_google_services=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Firebase google-services.json (if secret provided)
        if: steps.config.outputs.has_google_services == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Resolve Android version metadata
        id: version
        env:
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          VERSION_NAME=$(node -e "console.log(require('./package.json').version)")
          VERSION_CODE="${INPUT_VERSION_CODE:-${GITHUB_RUN_NUMBER}}"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        if: steps.config.outputs.has_signing == 'true' && github.event.inputs.build_type != 'debug'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/selah-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Release certificate fingerprints (register SHA-1 in Firebase for Google Sign-In):"
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:" || true

          cd android
          chmod +x gradlew
          ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" \
            ./gradlew assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

          cd ..
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "build-artifacts/Selah-v${VERSION_NAME}-${VERSION_CODE}-release.apk"

      - name: Build Debug APK (no release keystore configured or debug requested)
        if: steps.config.outputs.has_signing != 'true' || github.event.inputs.build_type == 'debug'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

          cd ..
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "build-artifacts/Selah-v${VERSION_NAME}-${VERSION_CODE}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: selah-android-apk
          path: build-artifacts/*.apk
          retention-days: 14

      - name: Cleanup temporary keystore
        if: always()
        run: |
          if [ -n "${KEYSTORE_PATH:-}" ] && [ -f "$KEYSTORE_PATH" ]; then
            rm -f "$KEYSTORE_PATH"
          fi
